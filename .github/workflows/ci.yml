name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Format, lint, types, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --omit=dev
      - run: npm run build

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v7
      - name: Build the production image
        run: docker build --tag maison-vauclair:ci .
      - name: Start it and probe the health route
        run: |
          docker run --detach --name app --publish 3000:3000 maison-vauclair:ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:3000/api/health; then exit 0; fi
            sleep 1
          done
          docker logs app
          exit 1

  # Production only receives a version that passed every check above.
  deploy:
    name: Deploy to Dokploy
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Ask Dokploy to deploy main
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_APPLICATION_ID: ${{ secrets.DOKPLOY_APPLICATION_ID }}
        run: |
          if [ -z "$DOKPLOY_URL" ] || [ -z "$DOKPLOY_API_KEY" ] || [ -z "$DOKPLOY_APPLICATION_ID" ]; then
            echo "::error::Secrets DOKPLOY_URL, DOKPLOY_API_KEY and DOKPLOY_APPLICATION_ID are required."
            exit 1
          fi
          curl --fail-with-body --silent --show-error --max-time 60 \
            --request POST "${DOKPLOY_URL%/}/api/application.deploy" \
            --header "Content-Type: application/json" \
            --header "x-api-key: ${DOKPLOY_API_KEY}" \
            --data "{\"applicationId\": \"${DOKPLOY_APPLICATION_ID}\"}"
